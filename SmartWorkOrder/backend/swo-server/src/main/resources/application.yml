server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

spring:
  application:
    name: smart-work-order
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jackson:
    time-zone: UTC
  servlet:
    multipart:
      max-file-size: 12MB
      max-request-size: 12MB
  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/swo?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 5000
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
      timeout: 3s
  sql:
    init:
      mode: never

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.swo.pojo.entity
  configuration:
    map-underscore-to-camel-case: true
    default-fetch-size: 100

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

app:
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-change-me-0123456789abcdef}
    issuer: swo
    ttl: PT2H
    token-name: Authorization
    token-prefix: "Bearer "
  upload:
    dir: ${UPLOAD_DIR:./uploads}
    max-file-size: 10485760
  ai:
    base-url: ${AI_BASE_URL:http://127.0.0.1:8000}
    internal-token: ${AI_INTERNAL_TOKEN:dev-internal-token}
    connect-timeout: 5s
    read-timeout: 120s
  seed:
    enabled: ${SEED_ENABLED:false}
    password: "${SEED_PASSWORD:Demo123!}"
